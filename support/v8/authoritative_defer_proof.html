<!doctype html>
<!--
Runtime proof that a deferred authoritative classic script runs on V8.

Defer has the widest window between compiling into the realm and running: the
script is compiled at fetch completion but not run until the end of parsing.
Both sides fail the script rather than aborting if the sidecar or realm has
gone in between.

Same counting argument as authoritative_bgcolor_proof.html: the body starts red
and the script toggles document.bgColor once per execution, so lime is only
reachable when V8 alone executed it exactly once.

Run via support/v8/run_proofs.sh, or directly:

  RUST_LOG=warn,script::script_thread=debug \
    target/debug/servoshell -z -x --hard-fail -o /tmp/proof.png \
      support/v8/authoritative_defer_proof.html
-->
<html>
  <head>
    <meta charset="utf-8">
    <title>V8-authoritative defer proof</title>
    <script data-servo-v8="authoritative" defer src="authoritative_external.js"></script>
  </head>
  <body bgcolor="red">

  </body>
</html>
