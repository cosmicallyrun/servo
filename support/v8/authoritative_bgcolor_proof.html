<!doctype html>
<!--
Runtime proof that V8 alone executes an authoritative classic script.

The body starts red. The script below toggles document.bgColor exactly once
per execution, so the final colour counts executions rather than merely
observing that some engine ran: an odd number of executions ends lime and an
even number ends red. If SpiderMonkey also executed this script the page would
render red, so lime is only reachable when V8 is the sole executor.

Build and run:

  cargo build -p servoshell --features v8-classic-script-authoritative
  RUST_LOG=warn,script::script_thread=debug \
    target/debug/servoshell -z -x \
      -o /tmp/authoritative_bgcolor_proof.png \
      support/v8/authoritative_bgcolor_proof.html

The realm teardown line must report exactly one bgColor getter and one bgColor
setter host call.
-->
<html>
  <head>
    <meta charset="utf-8">
    <title>V8-authoritative bgColor proof</title>
  </head>
  <body bgcolor="red">
    <script data-servo-v8="authoritative">
      if (globalThis !== window ||
          window.window !== window ||
          window.document !== document) {
        throw new Error("bad identity");
      }
      document.bgColor =
        document.bgColor === "lime" ? "red" : "lime";
    </script>
  </body>
</html>
