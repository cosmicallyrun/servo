<!doctype html>
<!--
Runtime proof for the production-pinned V8 console logging slice.

The proof runner checks both the rendered execution count and all six messages
in Servoshell's real embedder output. The object has a hostile toString to pin
that generic inspection stays side-effect free inside V8.

Run via support/v8/run_proofs.sh.
-->
<html>
  <head>
    <meta charset="utf-8">
    <title>V8 authoritative console proof</title>
  </head>
  <body bgcolor="red">
    <script data-servo-v8="authoritative">
      let touched = false;
      const hostile = {
        toString() {
          touched = true;
          throw new Error("console inspection invoked toString");
        },
      };
      console.debug("SERVO_V8_CONSOLE_DEBUG", 1);
      console.error("SERVO_V8_CONSOLE_ERROR", false);
      console.info("SERVO_V8_CONSOLE_INFO", null);
      console.log("SERVO_V8_CONSOLE_LOG", 42, true, hostile);
      console.trace("SERVO_V8_CONSOLE_TRACE");
      console.warn("SERVO_V8_CONSOLE_WARN", "✓");
      if (touched) {
        throw new Error("console inspection was observable");
      }
      document.bgColor = document.bgColor === "lime" ? "red" : "lime";
    </script>
  </body>
</html>
