<!doctype html>
<!--
Runtime proof for the first generated production WebIDL operation.

Document.getElementById converts a required DOMString argument in V8, borrows
Servo's SpiderMonkey JSContext only for the native call, and returns an Element
through the same per-realm wrapper cache as documentElement and head. The
script checks conversion exceptions, brand ordering, method metadata, null,
and wrapper identity before toggling the body from red to lime.

Run via support/v8/run_proofs.sh.
-->
<html>
  <head>
    <meta charset="utf-8">
    <title>V8-authoritative getElementById proof</title>
  </head>
  <body bgcolor="red">
    <div id="target"></div>
    <script data-servo-v8="authoritative">
      var descriptor = Object.getOwnPropertyDescriptor(
        Object.getPrototypeOf(document),
        "getElementById",
      );
      if (
        !descriptor ||
        Object.hasOwn(document, "getElementById") ||
        typeof descriptor.value !== "function" ||
        !descriptor.writable ||
        !descriptor.enumerable ||
        !descriptor.configurable ||
        descriptor.value.name !== "getElementById" ||
        descriptor.value.length !== 1
      ) {
        throw new Error("getElementById method descriptor is wrong");
      }

      var wrongBrandStringified = false;
      var rejectedWrongBrand = false;
      try {
        descriptor.value.call({}, {
          toString: function () {
            wrongBrandStringified = true;
            return "target";
          },
        });
      } catch (error) {
        rejectedWrongBrand = error instanceof TypeError;
      }
      if (!rejectedWrongBrand || wrongBrandStringified) {
        throw new Error("receiver brand check ran after argument conversion");
      }

      var conversionSentinel = new Error("conversion sentinel");
      var preservedConversionError = false;
      try {
        document.getElementById({
          toString: function () {
            throw conversionSentinel;
          },
        });
      } catch (error) {
        preservedConversionError = error === conversionSentinel;
      }
      if (!preservedConversionError) {
        throw new Error("DOMString conversion exception was replaced");
      }

      var rejectedSymbol = false;
      try {
        document.getElementById(Symbol("target"));
      } catch (error) {
        rejectedSymbol = error instanceof TypeError;
      }
      var rejectedMissing = false;
      try {
        document.getElementById();
      } catch (error) {
        rejectedMissing = error instanceof TypeError;
      }
      if (!rejectedSymbol || !rejectedMissing) {
        throw new Error("required DOMString argument checks failed");
      }

      var found = document.getElementById({
        toString: function () {
          return "target";
        },
      });
      if (
        found === null ||
        found.tagName !== "DIV" ||
        found === document.documentElement ||
        found === document.head ||
        document.getElementById("missing") !== null ||
        document.getElementById("") !== null ||
        document.getElementById("a\0b") !== null ||
        document.getElementById("\uD800") !== null
      ) {
        throw new Error("getElementById returned the wrong DOM object");
      }
      found.servoIdMarker = 47;
      if (
        document.getElementById("target") !== found ||
        document.getElementById("target").servoIdMarker !== 47
      ) {
        throw new Error("getElementById wrapper identity was not preserved");
      }

      document.bgColor = document.bgColor === "lime" ? "red" : "lime";
    </script>
  </body>
</html>
